# Dependency audit for CloudinatorFTP (CLAUDE.md 5.32): pip-audit on the packages that
# requirements.txt installs, using the same runner as developers: `python tests/qa.py audit`.
# NOT a required check, on purpose: new advisories appear without any code change and would block
# unrelated pull requests, and a path-filtered workflow does not report on every pull request.
# It runs weekly, on demand, and when the dependency files or the accepted-findings list change.
# A finding that cannot be fixed yet goes into tests/audit_ignore.txt with the reason.
name: Dependency audit

on:
    schedule:
        - cron: "23 3 * * 1"
    workflow_dispatch:
    push:
        branches: ["main", "dev"]
        paths:
            - "requirements.txt"
            - "constraints.txt"
            - "tests/audit_ignore.txt"
            - "tests/qa.py"
            - ".github/workflows/audit.yml"
    pull_request:
        branches: ["main", "dev"]
        paths:
            - "requirements.txt"
            - "constraints.txt"
            - "tests/audit_ignore.txt"
            - "tests/qa.py"
            - ".github/workflows/audit.yml"

permissions:
    contents: read

concurrency:
    group: audit-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        name: dependency audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14.7"

            - name: Install the application's requirements
              run: python -m pip install --upgrade pip -r requirements.txt

            # pip-audit lives in its OWN environment so its own dependencies are not audited as if
            # they were the application's.
            - name: Install pip-audit (separate environment)
              run: |
                  python -m venv "$RUNNER_TEMP/audit-tool"
                  "$RUNNER_TEMP/audit-tool/bin/python" -m pip install pip-audit

            - name: Audit the installed packages
              run: |
                  SITE="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
                  "$RUNNER_TEMP/audit-tool/bin/python" tests/qa.py audit --path "$SITE"
