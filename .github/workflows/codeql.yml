# CodeQL scan for CloudinatorFTP (Python + JavaScript), on pushes and pull requests to main and dev.
#
# Besides sending the alerts to the repository's Security tab, this workflow keeps the raw SARIF
# files and turns them into CSV (tests/codeql_sarif_parser.py), because GitHub cannot export
# code-scanning results as CSV outside Enterprise:
#   Actions > this run > Artifacts:
#     sarif-artifact-<language>    the SARIF files, as before
#     codeql-csv-<language>        one CSV per language
#     codeql-findings-csv          both languages combined (the "report" job)
#
# NOTE: this advanced workflow cannot run while the repository's "default setup" for CodeQL is
# enabled (Settings > Advanced Security / Code security > Code scanning > CodeQL analysis:
# switch to "advanced" / disable the default setup first), otherwise the upload is rejected.
name: "CodeQL Advanced"

on:
    push:
        branches: ["main", "dev"]
    pull_request:
        branches: ["main", "dev"]
    schedule:
        # scheduled runs always use the repository's default branch
        - cron: "22 9 * * 3"
    workflow_dispatch:

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        # Runner size impacts CodeQL analysis time. To learn more, please see:
        #   - https://gh.io/recommended-hardware-resources-for-running-codeql
        #   - https://gh.io/supported-runners-and-hardware-resources
        #   - https://gh.io/using-larger-runners (GitHub.com only)
        runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
        permissions:
            # required for all workflows
            security-events: write

            # required to fetch internal or private CodeQL packs
            packages: read

            # only required for workflows in private repositories
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      build-mode: none
                    - language: python
                      build-mode: none
                # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
                # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
                # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # Initializes the CodeQL tools for scanning.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  # vendored third-party files (pdf.js, video.js, Font Awesome, ...) are skipped
                  config-file: ./.github/codeql/codeql-config.yml
                  # "security-extended" = the default security queries plus lower-precision ones
                  # (more alerts, a few more false positives); the default setup in the web UI
                  # offers the same choice. For code-quality alerts too use "security-and-quality";
                  # to go back to the plain default suite delete the next line.
                  queries: security-and-quality

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: "/language:${{matrix.language}}"
                  # keep a copy of the SARIF files in the workspace (the default, ../results, is
                  # refused by upload-artifact); they are still uploaded to Code Scanning as usual
                  output: sarif-results

            - name: Set up Python (for the SARIF parser)
              if: always()
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Convert SARIF to CSV
              if: always()
              run: python tests/codeql_sarif_parser.py sarif-results --out codeql-csv

            - name: Upload SARIF files
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: sarif-artifact-${{ matrix.language }}
                  path: sarif-results/
                  if-no-files-found: warn

            - name: Upload CSV
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: codeql-csv-${{ matrix.language }}
                  path: codeql-csv/
                  if-no-files-found: warn

    report:
        name: Combined CSV
        needs: analyze
        if: always()
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Download all SARIF artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: sarif-artifact-*
                  path: sarif-all
                  merge-multiple: true

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Combine into one CSV
              run: python tests/codeql_sarif_parser.py sarif-all --out codeql-findings

            - name: Upload combined CSV
              uses: actions/upload-artifact@v7
              with:
                  name: codeql-findings-csv
                  path: codeql-findings/
                  if-no-files-found: warn