# Ruff for CloudinatorFTP (CLAUDE.md 5.40): REPORT ONLY. It lints the Python files with the rules in
# pyproject.toml [tool.ruff] and prints every finding as an annotation, but it never fails
# (--exit-zero) and it is NOT a required check. The plan: look at the findings once, fix them or
# ignore a rule in pyproject.toml WITH a reason, then move `ruff check .` into the required job
# `smoke + check` (tests.yml) so that no ruleset has to change.
# The Ruff version is the pinned line in requirements-dev.txt (one place to bump it).
# Path-filtered on purpose, so a pull request that touches no Python file does not run it.
name: Ruff (report only)

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (report only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install the pinned Ruff
        run: python -m pip install --upgrade pip "$(grep -i '^ruff==' requirements-dev.txt)"

      - name: Ruff check (annotations, never fails)
        run: python -m ruff check . --output-format=github --exit-zero

      - name: Summary by rule
        if: always()
        run: |
          {
            echo "### Ruff findings by rule (report only)"
            echo '```'
            python -m ruff check . --statistics --exit-zero
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
