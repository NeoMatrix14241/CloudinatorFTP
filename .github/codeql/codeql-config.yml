# CodeQL configuration for CloudinatorFTP (used by .github/workflows/codeql.yml).
# Vendored third-party files are not analysed: they are not edited in this project
# (CLAUDE.md: "vendored files under static/ are not touched") and would drown the real alerts.
# Keep this list in step with VENDORED in tests/codeql_sarif_parser.py.
name: "CloudinatorFTP CodeQL config"

paths-ignore:
    - static/js/pdf.mjs
    - static/js/pdf.worker.mjs
    - static/js/viewer.mjs
    - static/js/video.js
    - static/js/cmaps/**
    - static/js/iccs/**
    - static/js/locale/**
    - static/js/standard_fonts/**
    - static/js/wasm/**
    - static/css/all.min.css
    - static/css/viewer.css
    - static/css/video.css
    - static/webfonts/**
