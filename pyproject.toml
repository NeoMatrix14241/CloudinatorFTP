# Tool configuration only (no [project] / [build-system]: CloudinatorFTP is not an installable package).
# pytest reads [tool.pytest.ini_options] (works with pytest 7, 8 and 9). Do NOT also keep a
# pytest.ini / tox.ini / setup.cfg with a [pytest] section: pytest would use that one instead.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The repository root on sys.path: only side-effect-free leaf modules (today: paths) may be
# imported in-process from the real tree, see tests/conftest.py.
pythonpath = ["."]
# tests/ has no __init__.py, so importlib mode keeps same-named test files in different layers apart.
addopts = "-ra --import-mode=importlib"
# pytest-timeout (requirements-dev.txt): a hung test is killed after this many seconds.
timeout = 120
markers = [
    "application: black-box tests against a scratch server started as a subprocess",
    "integration: tests multiple real application components",
    "protocol: starts FTP, SFTP or WebDAV against an isolated service",
    "property: property-based or generated-input tests",
    "reliability: concurrency, fault-injection and recovery tests",
    "performance: scale and performance tests",
    "browser: needs Playwright and Chromium",
]

# `python tests/qa.py coverage` (CLAUDE.md 5.34). Needs coverage >= 7.10 (python -m pip install "coverage>=7.10").
# The tests start the application and the protocol servers as SUBPROCESSES in scratch copies of the
# project: `patch = subprocess` measures them, `sigterm = true` saves their data when the harness
# stops them (Linux and macOS; Windows kills them without a chance to save, see qa.py). Do NOT set
# `source`: coverage would resolve it to the repository, not to the scratch copy a subprocess runs in.
# relative_files makes `sftp_server.py` in a scratch copy and in the repository the same file.
[tool.coverage.run]
branch = true
parallel = true
relative_files = true
omit = [
    "tests/*",
    ".venv/*",
    "venv/*",
    "*/site-packages/*",
    "*/sitecustomize.py",
]
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
skip_empty = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

# Ruff (CLAUDE.md 5.40). REPORT-ONLY for now: the "Ruff (report only)" workflow runs it with
# --exit-zero and prints the findings as annotations; nothing fails. Once the findings have been
# triaged (fixed, or ignored below WITH a reason) it becomes a required check inside `smoke + check`.
# The version is pinned in requirements-dev.txt (a new Ruff release adds rules and must not turn a
# green build red). Formatting stays with Black; Ruff only lints, so E501 (line length) is off.
# Run it locally:  python -m ruff check .
[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
    "static",
    "templates",
    "docs",
    "data",
    "artifacts",
    ".hypothesis",
]

[tool.ruff.lint]
# E/F = pycodestyle errors + pyflakes, B = bugbear (likely bugs), S = bandit (security).
select = ["E", "F", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Stand-alone scripts put the project root on sys.path first, so their imports follow code.
"dev_server.py" = ["E402"]
"prod_server.py" = ["E402"]
"tools/**" = ["E402"]
# Tests assert (S101), use throw-away passwords and /tmp-style paths on purpose, read source files
# with `ast` and run them with exec (S102: the point of the unit tests, see CODING_GUIDELINES.md
# 18.1), talk to the scratch server on 127.0.0.1 with urllib (S310) and test FTP itself (S321).
"tests/**" = [
    "S101",
    "S102",
    "S105",
    "S106",
    "S108",
    "S310",
    "S311",
    "S321",
    "S603",
    "S607",
    "B905",
    "E402",
]
