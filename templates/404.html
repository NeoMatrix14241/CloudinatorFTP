<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Page Not Found | Cloudinator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}"
        integrity="sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS" />
    <link rel="icon" href="{{ url_for('static', filename='icons/icon.webp') }}" type="image/webp"
        integrity="sha384-mTiIzUOmh2SfP6u6yyTJHcQnVqctGnma9JMZGwuIrFkKfjVtO7Ok8CMTjA8szFUp" />
    <link href="{{ url_for('static', filename='css/404.css') }}" rel="stylesheet"
        integrity="sha384-ym008taxaQPAlP3VVxz/rPEsSeV7wIgsMBQaCHdmlhRRq86iveUuztNM+NrBSp+S" />
</head>

<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>

        <h1 class="error-title">404</h1>
        <h2 class="error-subtitle">Page Not Found</h2>

        <p class="error-message">
            The page you're looking for doesn't exist or has been moved.
            This might happen if you followed an old link or typed the URL incorrectly.
        </p>

        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Go Home
            </a>
        </div>

        <div class="error-details">
            <h4>What you can do:</h4>
            <ul>
                <li>
                    <i class="fas fa-check"></i>
                    Check the URL for typos
                </li>
                <li>
                    <i class="fas fa-check"></i>
                    Visit the home page
                </li>
                <li>
                    <i class="fas fa-check"></i>
                    Make sure you're logged in
                </li>
            </ul>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/404.js') }}"
        integrity="sha384-+0MnZlFk/xl5EPlCPJPSdyMC7YOfpy5BeIg800UXzJhSPJ9uoCJF7X5yCZ0fsIt8"></script>
    <audio id="bgMusic" autoplay loop preload="auto">
        <source src="{{ url_for('static', filename='audio/bg_mus.opus') }}" type="audio/ogg">
    </audio>
    <script src="{{ url_for('static', filename='js/bg_audio.js') }}"
        integrity="sha384-hm1jtKk9iRd32XFDgQLBrsh0torUKWUnGtTfdwWrLrk2VUnH56WbkhuaL90f1g7i" defer></script>
</body>

</html>
